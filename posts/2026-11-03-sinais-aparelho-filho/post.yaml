    titulo: "Seu filho precisa de *aparelho*?"
    subtitulo: "5 sinais para observar em casa — salva para não esquecer."
  - tipo: texto
    numero: "01"
    titulo: "Dentes *encavalados*"
    texto: "Os dentes permanentes nascem sem espaço e ficam tortos ou uns por cima dos outros."
  - tipo: texto
    numero: "02"
    titulo: "Respira pela *boca*"
    texto: "Dormir de boca aberta ou roncar com frequência merece atenção: pode influenciar o crescimento da face e a posição dos dentes."
  - tipo: texto
    numero: "03"
    titulo: "Chupeta ou dedo depois dos *4 anos*"
    texto: "O hábito prolongado pode deixar a mordida aberta ou os dentes da frente projetados."
  - tipo: texto
    numero: "04"
    titulo: "Mordida *cruzada*"
    texto: "Ao fechar a boca, alguns dentes de cima ficam por dentro dos de baixo."
  - tipo: texto
    numero: "05"
    titulo: "Perdeu dente de leite *cedo*"
    texto: "Quando o dente de leite sai antes da hora, os vizinhos podem se mover e faltar espaço para o permanente."
  - tipo: texto
    titulo: "E quando *levar*?"
    texto: "A primeira avaliação ortodôntica costuma ser indicada por volta dos 7 anos — mesmo que pareça tudo bem.\n\nQuanto antes a gente acompanha, mais simples pode ser o caminho."
  - tipo: cta
    titulo: "Cuide do sorriso de quem você *ama*"
    subtitulo: "Agende a avaliação do seu filho. Cada caso é único."
legenda: |
  Mãe, esse post é pra você salvar 💕

  Muitas vezes a gente só pensa em aparelho quando os dentes já estão bem tortinhos. Mas alguns sinais aparecem bem antes — e observar cedo pode deixar o tratamento muito mais simples.

  Seu filho tem algum desses sinais? Me conta aqui nos comentários ou me chama no WhatsApp que eu te explico com calma 🦷✨

  📍 Olinda Shopping, sala 40 — pertinho de quem é de Olinda e de Paulista
  Cada caso é único: só a avaliação presencial define o melhor caminho.
  Dra. Manuela Gondim · CRO-PE 14.254
