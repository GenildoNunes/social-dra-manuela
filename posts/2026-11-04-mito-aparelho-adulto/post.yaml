    titulo: "Aparelho é coisa de *adolescente*?"
    subtitulo: "Arrasta para descobrir o que a ortodontia diz sobre isso."
  - tipo: mito
    veredito: Mito
    frase: "Depois dos 18 anos não adianta mais usar aparelho."
    texto: "Os dentes podem ser movimentados em qualquer idade, desde que *gengiva e ossos estejam saudáveis*. Cada vez mais adultos fazem tratamento ortodôntico."
  - tipo: mito
