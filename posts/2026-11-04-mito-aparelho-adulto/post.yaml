slides:
- tipo: capa
  tag: Mito ou verdade?
  titulo: Aparelho é coisa de *adolescente*?
  subtitulo: Arrasta para descobrir o que a ortodontia diz sobre isso.
- tipo: mito
  veredito: Mito
  frase: Depois dos 18 anos não adianta mais usar aparelho.
  texto: Os dentes podem ser movimentados em qualquer idade, desde que *gengiva e ossos estejam saudáveis*. Cada vez mais adultos fazem tratamento ortodôntico.
- tipo: mito
  veredito: Verdade
  frase: Existem opções mais discretas para adultos.
  texto: Aparelhos estéticos e alinhadores transparentes são alternativas que *chamam menos atenção* no dia a dia. A indicação depende de cada caso.
- tipo: mito
  veredito: Mito
  frase: Aparelho serve só para deixar o sorriso bonito.
  texto: Dentes bem posicionados também ajudam na *mastigação*, na *higiene* e no equilíbrio da mordida.
- tipo: cta
  titulo: “Um dia eu cuido de mim” pode ser *hoje*
  subtitulo: Agende sua avaliação e descubra qual tratamento combina com você.
legenda: |
  "Doutora, eu já passei da idade de usar aparelho" — é uma das frases que eu mais escuto aqui no consultório 😅

  E quase sempre vem de mulheres incríveis que cuidaram primeiro dos filhos, da casa, do trabalho… e deixaram o próprio sorriso para depois 💕

  A verdade é que a ortodontia não tem idade: o que importa é a saúde da gengiva e dos ossos. E hoje existem opções bem mais discretas do que aquele aparelho que a gente lembra da escola ✨

  Qual desses você achava que era verdade? Conta aqui 👇 E se quiser tirar dúvidas, me chama no WhatsApp.

  Cada caso é único — só a avaliação presencial define o melhor tratamento.
  Dra. Manuela Gondim · CRO-PE 14.254
