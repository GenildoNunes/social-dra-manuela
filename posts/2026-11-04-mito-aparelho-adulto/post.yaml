legenda: |
  "Já passei da idade de usar aparelho" — escuto muito isso aqui no consultório! 😅

  A verdade é que a ortodontia não tem idade: o que importa é a saúde da gengiva e dos ossos que sustentam os dentes. E hoje existem opções bem mais discretas do que aquele aparelho que a gente lembra da escola ✨

  Qual desses você achava que era verdade? Conta aqui nos comentários 👇

  Cada caso é único — só a avaliação presencial define o melhor tratamento.
  Dra. Manuela Gondim · Ortodontista · CRO-PE 14.254
