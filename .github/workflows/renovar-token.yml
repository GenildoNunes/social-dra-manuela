name: Renovar token do Instagram

# O token do Instagram vale 60 dias; renovando toda semana ele nunca vence.
on:
  schedule:
    - cron: "0 9 * * 1"   # segunda, 6h de Recife
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar e salvar o novo token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$IG_TOKEN" ] || [ -z "$GH_TOKEN" ]; then
            echo "IG_TOKEN ou GH_PAT não configurados — rode scripts/configurar_meta.py"; exit 1
          fi
          resposta=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN")
          novo=$(echo "$resposta" | jq -r '.access_token // empty')
          if [ -z "$novo" ]; then
            echo "Falha ao renovar: $(echo "$resposta" | jq -c '.error // .')"; exit 1
          fi
          echo "::add-mask::$novo"
          gh secret set IG_TOKEN -R "${{ github.repository }}" --body "$novo"
          echo "Token renovado; válido por mais $(( $(echo "$resposta" | jq -r '.expires_in') / 86400 )) dias."
